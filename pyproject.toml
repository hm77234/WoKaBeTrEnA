[project]
name = "vocabeltrainer"
version = "0.1.135"
description = "simple multilingual vocable trainer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asgiref>=3.11.0",
    "bs4>=0.0.2",
    "coloredlogs>=15.0.1",
    "flask>=3.1.2",
    "flask-login>=0.6.3",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.2.2",
    "httptools>=0.7.1", #pyinstaller
    "httpx>=0.28.1",
    "pyinstaller>=6.19.0", #pyinstaller
    "pytest==8.3.3",
    "pytest-cov>=7.1.0",
    "pytest-flask>=1.3.0",
    "selenium>=4.41.0",
    "uvicorn[standard]>=0.40.0", #pyinstaller
    "uvloop>=0.22.1", #pyinstaller
    "watchgod>=0.8.2", #pyinstaller
    "webdriver-manager>=4.0.2",
    "websockets>=16.0", #pyinstaller
    "werkzeug>=3.1.5",
    "wsproto>=1.3.2", #pyinstaller
]
[tool.bumpver]
current_version = "0.1.135"
version_pattern = "MAJOR.MINOR.PATCH"
commit = true                    # Auto-commit
commit_message = 'Latest Version {new_version}'
tag = true                       # Auto-tag
tag_name = "v{version}"
push = true                     #  auto-push

[tool.bumpver.file_patterns]
"app/app.py" = ["__VERSION__ = \"{version}\""]
"app/models.py" = ["__VERSION__ = \"{version}\""]
"pyproject.toml" = ["version = \"{version}\""]
"changelog.md" = ["# app.py new {version}"]
"tests/conftest.py" = ["__VERSION__ = \"{version}\""]


[tool.coverage.run]
source = ["."]

[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "pragma: selenium skip",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",  # regex, keine Zeichenfehler
    "if TYPE_CHECKING:"
]